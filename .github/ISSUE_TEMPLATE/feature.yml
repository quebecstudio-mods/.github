name: Feature request
description: Something the package should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The situation on your site, before any solution.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Site CSS, an overridden template, a workaround, or nothing.
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
    validations:
      required: true
