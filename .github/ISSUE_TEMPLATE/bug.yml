name: Bug report
description: Something behaves differently from what the documentation says
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: quebecstudio-mods/craftcms-consent-kit 5.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and PHP version
      placeholder: Craft CMS 5.11, PHP 8.3
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: >
        For a rendering problem, the markup around the banner and the site's own
        CSS help more than a screenshot. For a security flaw, write to
        info@quebecstudio.com instead of opening an issue.
